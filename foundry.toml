[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# Holdback's contracts, which the tests deploy, use the Prague precompiles and the IR pipeline.
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
# Local chain only. No RPC endpoints are configured on purpose.
chain_id = 31337
fs_permissions = [{ access = "read", path = "./out" }, { access = "read-write", path = "./deployments" }]

[fuzz]
runs = 256

[fmt]
line_length = 120
